# Served behind Traefik (TLS on 443). nginx itself listens on 8080, so
# keep redirects relative or "/ucpa_2027" would redirect to ":8080".
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Piste map images are large and never change once published.
    location ~* \.(jpg|jpeg|png|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
